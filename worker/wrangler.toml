name = "javstore-sync"
main = "src/worker.mjs"
compatibility_date = "2025-01-01"

# No javstore-sync.<subdomain>.workers.dev URL. workers.dev subdomains are guessable, and
# the history behind this one is worth not advertising, so the worker is reachable only on a
# route you configure below. Deploying with this off and no route leaves it unreachable —
# comment it back out, or add the route, before deploying.
workers_dev = false

# The custom domain the worker answers on. Its zone has to be on the same Cloudflare account.
# routes = [
#     { pattern = "sync.example.com", custom_domain = true },
# ]

# One object holds the whole history in its own SQLite database. Being single-threaded is
# the point: it makes each sync's read-merge-write strongly consistent.
[[durable_objects.bindings]]
name = "SYNC_STORE"
class_name = "SyncStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncStore"]

[vars]
# Browsers only enforce this when the userscript falls back to fetch; GM_xmlhttpRequest
# ignores CORS. Set it to "*" if you also sync from another origin.
ALLOWED_ORIGIN = "https://javstore.net"

# Upgrading from the KV-backed version (6.2.0)? Uncomment this with your namespace id and
# deploy: the worker imports that document once, and you can then remove both the binding
# and the namespace.
# [[kv_namespaces]]
# binding = "JAVSTORE_SYNC"
# id = "YOUR_OLD_KV_NAMESPACE_ID"

# SYNC_TOKEN is a secret, not a var: npx wrangler secret put SYNC_TOKEN
