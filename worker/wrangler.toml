name = "javstore-sync"
main = "src/worker.mjs"
compatibility_date = "2025-01-01"

# Created with: npx wrangler kv namespace create JAVSTORE_SYNC
# Paste the id it prints below.
[[kv_namespaces]]
binding = "JAVSTORE_SYNC"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[vars]
# Browsers only enforce this when the userscript falls back to fetch; GM_xmlhttpRequest
# ignores CORS. Set it to "*" if you also sync from another origin.
ALLOWED_ORIGIN = "https://javstore.net"

# SYNC_TOKEN is a secret, not a var: npx wrangler secret put SYNC_TOKEN
